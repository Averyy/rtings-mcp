name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored anywhere. PyPI is told, once, that
# releases of the project may come from this repository's `publish.yml` running in the
# `pypi` environment; each run then mints a short-lived token for itself.
#
# Trigger: publishing a GitHub release whose tag is the version (`v0.2.1`). The tag must
# match `src/rtings_mcp/__init__.py`, or the job refuses — one source of truth for the
# version, and a release page that says one thing while the wheel says another is the
# kind of quiet inconsistency the project spends its rules avoiding.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Offline tests
        run: uv run pytest tests/ -q

  build:
    name: Build sdist and wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Release tag must match the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/rtings_mcp/__init__.py').read_text()).group(1))")"
          if [ "$tag" != "$version" ]; then
            echo "release tag v$tag does not match __version__ $version" >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rtings-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
